[project]
name = "sat-consensus-bot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram==3.31.0",
    "httpx==0.28.1",
    "pydantic>=2.4.1,<2.14",
    "pydantic-settings>=2.0,<3",
    "Pillow==12.3.0",
    "PyYAML>=6,<7",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.6",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
